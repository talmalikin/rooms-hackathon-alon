<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האקתון גדוד אלון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700;900&display=swap">
<style>
/* Layout: dark-first "event badge" page — glowing search bar on a dotted grid, result rendered as a hackathon badge with a huge team number and a neon room pill. */
:root{
  --bg:#0b0f1e; --bg2:#121a33; --paper:#161f3a; --fg:#f2f4ff; --muted:#8e97b8; --line:#2a3458;
  --hot:#ff5c7a; --volt:#ffd43b; --cyan:#3de1ff; --hot-fg:#1a0a10; --volt-fg:#1a1400;
  --grid:rgba(120,140,255,.14); --glow:rgba(61,225,255,.35);
  --display:'Secular One','Heebo',Arial,sans-serif; --body:'Heebo',Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg:#f4f5fb; --bg2:#e9ecf8; --paper:#ffffff; --fg:#111633; --muted:#5e6686; --line:#d6dbee;
  --hot:#e8325a; --volt:#f2b600; --cyan:#0aa7c9; --hot-fg:#ffffff; --volt-fg:#1a1400;
  --grid:rgba(40,60,160,.12); --glow:rgba(10,167,201,.25); color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f4f5fb; --bg2:#e9ecf8; --paper:#ffffff; --fg:#111633; --muted:#5e6686; --line:#d6dbee;
  --hot:#e8325a; --volt:#f2b600; --cyan:#0aa7c9; --hot-fg:#ffffff; --volt-fg:#1a1400;
  --grid:rgba(40,60,160,.12); --glow:rgba(10,167,201,.25); color-scheme:light }

*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;
  padding-inline:16px;padding-block:24px 64px;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,92,122,.22), transparent 60%),
    radial-gradient(700px 420px at 0% 10%, rgba(61,225,255,.18), transparent 60%),
    radial-gradient(var(--grid) 1.2px, transparent 1.3px) 0 0/22px 22px,
    linear-gradient(var(--bg),var(--bg2));
  background-attachment:fixed}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

header{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.12em;
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--cyan);background:color-mix(in srgb,var(--paper) 70%,transparent)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,84px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--hot)}
.sub{color:var(--muted);margin:0;font-size:16px;max-width:46ch}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.stats b{color:var(--fg);font-size:18px;font-family:var(--display);font-weight:400;margin-left:4px}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:22px;font-weight:500;padding:18px 56px 18px 18px;border:2px solid var(--line);border-radius:18px;
  background:var(--paper);color:var(--fg);outline:none;box-shadow:0 10px 40px -20px var(--glow);transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted);font-weight:400}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px var(--glow),0 10px 40px -20px var(--glow)}
.search svg{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:24px;height:24px;stroke:var(--cyan);fill:none;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:8px 6px 0}

.list{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;background:none;border:0;
  border-bottom:1px solid var(--line);padding:13px 18px;color:var(--fg);cursor:pointer}
.list button:last-child{border-bottom:0}
.list button:hover,.list button:focus-visible{background:color-mix(in srgb,var(--cyan) 10%,var(--paper));outline:none}
.list .meta{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:16px 18px;color:var(--muted)}

/* badge */
.badge{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.6);display:flex;flex-direction:column}
.badge::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--hot),var(--volt),var(--cyan))}
.badge .top{padding:26px 24px 18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge .name{font-family:var(--display);font-size:clamp(30px,7vw,40px);margin:0;line-height:1.05}
.badge .who{color:var(--muted);font-size:15px;margin:4px 0 0}
.room{display:inline-flex;flex-direction:column;align-items:center;background:var(--volt);color:var(--volt-fg);border-radius:14px;padding:8px 18px;line-height:1;
  transform:rotate(-2deg);box-shadow:0 8px 24px -8px var(--volt)}
.room small{font-size:12px;font-weight:700;letter-spacing:.14em}
.room b{font-family:var(--display);font-weight:400;font-size:34px;margin-top:2px;font-variant-numeric:tabular-nums}
.teamband{display:flex;align-items:center;gap:18px;padding:14px 24px;background:color-mix(in srgb,var(--hot) 14%,var(--paper));border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.teamband .n{font-family:var(--display);font-size:72px;line-height:1;color:var(--hot);font-variant-numeric:tabular-nums}
.teamband .l{display:flex;flex-direction:column;gap:2px}
.teamband .l span:first-child{font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.teamband .l span:last-child{font-size:18px;font-weight:700}
.mates{padding:18px 24px 22px}
.mates h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.mates ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.mates li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;min-width:0}
.mates li span:last-child{color:var(--muted);font-size:14px;white-space:nowrap}
.mates li.me span:first-child{color:var(--cyan);font-weight:700}
.badge .foot{display:flex;justify-content:space-between;align-items:center;padding:0 24px 20px;gap:12px;flex-wrap:wrap}
.back{font:inherit;font-size:14px;font-weight:700;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--fg);cursor:pointer}
.back:hover{border-color:var(--cyan);color:var(--cyan)}
.share{font-size:12px;color:var(--muted);letter-spacing:.08em}

details{border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;font-family:var(--display);font-size:22px;list-style:none;display:flex;align-items:center;gap:10px}
summary::before{content:"+";color:var(--hot);font-size:26px;line-height:1}
details[open] summary::before{content:"−"}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.roomcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.roomcard .rn{display:flex;align-items:baseline;gap:8px}
.roomcard .rn small{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.roomcard .rn b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--volt)}
.roomcard .ts{display:flex;gap:6px;flex-wrap:wrap}
.roomcard button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;padding:4px 10px;cursor:pointer}
.roomcard button:hover{border-color:var(--hot);color:var(--hot)}
footer{font-size:13px;color:var(--muted);padding-top:4px}
@media (max-width:440px){.mates ul{grid-template-columns:1fr}.teamband .n{font-size:60px}}
@media (prefers-reduced-motion:no-preference){
  .badge{animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
}
</style>
</head>

const people = ROWS.map((r,i)=>({id:i,name:r[0],company:r[1],program:r[2],team:r[3]}));
const byTeam = {};
people.forEach(p=>{(byTeam[p.team] ||= []).push(p)});

const fin = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const norm = s => (s||'').replace(/[\s'"׳״\-–]/g,'').replace(/[ךםןףץ]/g,c=>fin[c]).toLowerCase();
const normWords = s => (s||'').split(/\s+/).map(norm).filter(Boolean);
const q = document.getElementById('q'), out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function search(text){
  const words = normWords(text);
  if(!words.length) return [];
  return people.filter(p=>{const n=norm(p.name);return words.every(w=>n.includes(w));})
  .sort((a,b)=>{
    const aw = normWords(a.name).some(x=>x.startsWith(words[0]))?0:1;
    const bw = normWords(b.name).some(x=>x.startsWith(words[0]))?0:1;
    return aw-bw || a.name.localeCompare(b.name,'he');
  });
}
function renderList(){
  const text = q.value.trim();
  if(!text){ out.innerHTML=''; return; }
  const res = search(text);
  if(!res.length){ out.innerHTML='<div class="list"><div class="empty">לא נמצא שם כזה. נסו רק שם משפחה, או פתחו את רשימת החדרים למטה.</div></div>'; return; }
  if(res.length===1){ showPerson(res[0].id); return; }
  out.innerHTML = '<div class="list">'+res.slice(0,30).map(p=>
    `<button type="button" data-id="${p.id}"><span>${esc(p.name)}</span><span class="meta">פלוגה ${esc(p.company)} · צוות ${p.team}</span></button>`).join('')+'</div>';
}
const matesHTML = (mates, meId) => `<div class="mates"><h3>הצוות · ${mates.length} צוערים</h3><ul>${
  mates.map(m=>`<li class="${m.id===meId?'me':''}"><span>${esc(m.name)}</span><span>פלוגה ${esc(m.company)}</span></li>`).join('')}</ul></div>`;

function showPerson(id){
  const p = people[id];

      <div><p class="name">${esc(p.name)}</p><p class="who">פלוגה ${esc(p.company)}${p.program?' · '+esc(p.program):''}</p></div>

    </div>
    <div class="teamband"><div class="n">${p.team}</div><div class="l"><span>צוות</span><span>צוות ${p.team} · חדר ${esc(room(p.team))}</span></div></div>
    ${matesHTML(byTeam[p.team], p.id)}
    <div class="foot"><button type="button" class="back" id="back">← חיפוש נוסף</button><span class="share">גדוד אלון · האקתון</span></div>
  </div>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
function showTeam(t){
  out.innerHTML = `<div class="badge">
    <div class="top">
      <div><p class="name">צוות ${t}</p><p class="who">${byTeam[t].length} צוערים</p></div>
      <div class="room"><small>חדר</small><b>${esc(room(t))}</b></div>
    </div>

  </div>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
q.addEventListener('input', renderList);
out.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='back'){ q.value=''; out.innerHTML=''; q.focus(); return; }
  if(b.dataset.id!==undefined) showPerson(+b.dataset.id);
});
// חדרים → צוותים, לפי סדר הופעה
const byRoom = [];
Object.keys(byTeam).map(Number).sort((a,b)=>a-b).forEach(t=>{
  const r = room(t); let e = byRoom.find(x=>x.room===r); if(!e){e={room:r,teams:[]};byRoom.push(e);} e.teams.push(t);
});
const roomsEl = document.getElementById('rooms');
roomsEl.innerHTML = byRoom.map(e=>`<div class="roomcard"><div class="rn"><small>חדר</small><b>${esc(e.room)}</b></div><div class="ts">${
  e.teams.map(t=>`<button type="button" data-team="${t}">צוות ${t}</button>`).join('')}</div></div>`).join('');
roomsEl.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ showTeam(+b.dataset.team); } });
