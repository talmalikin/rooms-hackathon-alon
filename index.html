<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האקאלון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-width deep-green hero with drifting code/leaf particles and the logo on a white plate; a big white search bar overlaps the hero edge; results as a two-tone card (green header with the numbers, white body with the team). */
:root{
  --bg:#f6f5ef; --paper:#ffffff; --fg:#1f2418; --muted:#6c7262; --line:#e3e4da;
  --g1:#17351a; --g2:#2f6a2a; --g3:#4f9a3a; --gold:#f2c23a; --gold-deep:#c9961a; --brown:#7a4a1f; --red:#e04a3c;
  --hero-fg:#ffffff; --hero-muted:rgba(255,255,255,.72); --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.28);
  --tint:#eef5e8; --shadow:0 24px 60px -24px rgba(23,53,26,.45);
  --font:'Rubik','Heebo',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f140f; --paper:#1a211a; --fg:#eef0e8; --muted:#9ca694; --line:#2c352c; --tint:#1f2b1d;
  --shadow:0 24px 60px -24px rgba(0,0,0,.7); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f140f; --paper:#1a211a; --fg:#eef0e8; --muted:#9ca694; --line:#2c352c; --tint:#1f2b1d;
  --shadow:0 24px 60px -24px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;direction:rtl;padding-inline:16px;padding-block:0 64px;overflow-x:hidden}

.hero{position:relative;margin-inline:-16px;padding:40px 16px 96px;overflow:hidden;color:var(--hero-fg);text-align:center;
  background:
    radial-gradient(60% 80% at 50% 110%, rgba(242,194,58,.35), transparent 60%),
    radial-gradient(50% 60% at 10% 0%, rgba(79,154,58,.55), transparent 60%),
    linear-gradient(160deg,var(--g1),var(--g2) 70%,var(--g3))}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .in{position:relative;max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.plate{width:clamp(160px,40vw,210px);aspect-ratio:1;background:#fff;border-radius:50%;padding:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.12);display:grid;place-items:center}
.plate img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
.kicker{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--gold);margin-top:2px}
h1{font-size:clamp(44px,10vw,66px);font-weight:900;margin:2px 0 0;line-height:1;letter-spacing:-.02em;text-shadow:0 6px 24px rgba(0,0,0,.35)}
h2{font-size:clamp(24px,5.5vw,32px);font-weight:700;margin:6px 0 0;line-height:1.1}
.sub{margin:0;color:var(--hero-muted);font-size:16px;max-width:44ch}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pills span{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(6px);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--hero-fg)}
.pills b{font-weight:900;margin-left:4px;color:var(--gold)}

.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.search{margin-top:-34px;z-index:2}
.search .box{position:relative}
.search input{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:21px;font-weight:500;padding:20px 58px 20px 20px;border:0;border-radius:20px;background:var(--paper);color:var(--fg);outline:none;
  box-shadow:var(--shadow),0 0 0 1px var(--line)}
.search input::placeholder{color:var(--muted);font-weight:400}
.search input:focus{box-shadow:var(--shadow),0 0 0 3px var(--g3)}
.search .ico{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,var(--g2),var(--g3));display:grid;place-items:center;pointer-events:none}
.search .ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.hint{font-size:13px;color:var(--muted);margin:10px 8px 0;text-align:center}

.list{display:flex;flex-direction:column;gap:8px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;font-size:17px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 18px;color:var(--fg);cursor:pointer;transition:transform .12s,box-shadow .12s}
.list button:hover,.list button:focus-visible{transform:translateY(-1px);box-shadow:0 10px 24px -14px rgba(23,53,26,.4);border-color:var(--g3);outline:none}
.list .meta{color:var(--muted);font-size:14px;white-space:nowrap}
.empty{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--muted)}

.card{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.card .head{position:relative;color:#fff;padding:24px 24px 22px;background:linear-gradient(150deg,var(--g1),var(--g2) 75%,var(--g3));overflow:hidden}
.card .head::after{content:"</>";position:absolute;left:-6px;top:-26px;font-size:120px;font-weight:900;color:rgba(255,255,255,.06);font-family:monospace;pointer-events:none}
.card .name{font-size:clamp(28px,6.5vw,36px);font-weight:900;margin:0;line-height:1.1}
.card .who{margin:4px 0 0;color:var(--hero-muted);font-size:15px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.num{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;line-height:1.05}
.num .lbl{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--hero-muted)}
.num .val{font-size:clamp(34px,9vw,48px);font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.num.room{background:var(--gold);border-color:var(--gold);color:#2a1d02}
.num.room .lbl{color:rgba(42,29,2,.65)}
.body{padding:18px 24px 22px;display:flex;flex-direction:column;gap:14px}
.body h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.mates{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.mates li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--tint);border-radius:10px;padding:8px 12px;min-width:0}
.mates li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mates li .co{font-size:12px;font-weight:700;color:var(--g2);background:var(--paper);border-radius:6px;padding:1px 7px;white-space:nowrap}
.mates li.me{background:var(--gold);color:#2a1d02;font-weight:700}
.mates li.me .co{color:var(--brown)}
.back{align-self:flex-start;font:inherit;font-size:14px;font-weight:700;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--fg);cursor:pointer}
.back:hover{border-color:var(--g3);color:var(--g2)}

a.votelink{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2) 70%,var(--g3));border-radius:18px;padding:16px 20px;box-shadow:var(--shadow)}
a.votelink span{font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
a.votelink span i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(224,74,60,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,74,60,.6)}100%{box-shadow:0 0 0 10px rgba(224,74,60,0)}}
a.votelink small{color:var(--hero-muted);font-size:14px;text-align:left}
details{margin-top:4px}
summary{cursor:pointer;font-size:19px;font-weight:900;list-style:none;display:flex;align-items:center;gap:10px}
summary::before{content:"+";display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--g2),var(--g3));color:#fff;font-size:20px;font-weight:700}
details[open] summary::before{content:"−"}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.roomcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.roomcard .rn{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:flex;align-items:baseline;gap:8px}
.roomcard .rn b{font-size:26px;font-weight:900;color:var(--brown);letter-spacing:0}
.roomcard .ts{display:flex;gap:6px;flex-wrap:wrap}
.roomcard button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--tint);color:var(--g2);border-radius:8px;padding:4px 10px;cursor:pointer}
.roomcard button:hover{background:var(--g2);color:#fff}
footer{font-size:13px;color:var(--muted);text-align:center;padding-top:8px}
@media (max-width:440px){.mates{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){
  .card,.list{animation:up .3s cubic-bezier(.2,.8,.3,1.1)}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .plate{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
}
</style>
</head>

// מיפוי צוות → חדר
const ROOMS = {1:"312", 2:"312", 3:"312", 4:"315", 5:"315", 6:"315", 7:"315א", 8:"315א", 9:"315א", 10:"408", 11:"408", 12:"408", 13:"412", 14:"412", 15:"412", 16:"415", 17:"415", 18:"415", 19:"418", 20:"418", 21:"418", 22:"419", 23:"419", 24:"419", 25:"420", 26:"420", 27:"420", 28:"405", 29:"405", 30:"406", 31:"406", 32:"407", 33:"407"};
const room = t => ROOMS[t] ?? String(t);

const people = ROWS.map((r,i)=>({id:i,name:r[0],company:r[1],program:r[2],team:r[3]}));
const byTeam = {};
people.forEach(p=>{(byTeam[p.team] ||= []).push(p)});

const fin = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const norm = s => (s||'').replace(/[\s'"׳״\-–]/g,'').replace(/[ךםןףץ]/g,c=>fin[c]).toLowerCase();
const normWords = s => (s||'').split(/\s+/).map(norm).filter(Boolean);
const q = document.getElementById('q'), out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function search(text){
  const words = normWords(text);
  if(!words.length) return [];
  return people.filter(p=>{const n=norm(p.name);return words.every(w=>n.includes(w));})
  .sort((a,b)=>{
    const aw = normWords(a.name).some(x=>x.startsWith(words[0]))?0:1;
    const bw = normWords(b.name).some(x=>x.startsWith(words[0]))?0:1;
    return aw-bw || a.name.localeCompare(b.name,'he');
  });
}
function renderList(){
  const text = q.value.trim();
  if(!text){ out.innerHTML=''; return; }
  const res = search(text);
  if(!res.length){ out.innerHTML='<div class="empty">לא נמצא שם כזה. נסו רק שם משפחה, או פתחו את רשימת החדרים למטה.</div>'; return; }
  if(res.length===1){ showPerson(res[0].id); return; }
  out.innerHTML = '<div class="list">'+res.slice(0,30).map(p=>
    `<button type="button" data-id="${p.id}"><span>${esc(p.name)}</span><span class="meta">פלוגה ${esc(p.company)} · צוות ${p.team}</span></button>`).join('')+'</div>';
}
const matesHTML = (mates, meId) => `<ul class="mates">${
  mates.map(m=>`<li class="${m.id===meId?'me':''}"><span>${esc(m.name)}</span><span class="co">פלוגה ${esc(m.company)}</span></li>`).join('')}</ul>`;
const numsHTML = t => `<div class="nums"><div class="num"><span class="lbl">צוות</span><span class="val">${t}</span></div><div class="num room"><span class="lbl">חדר</span><span class="val">${esc(room(t))}</span></div></div>`;

function showPerson(id){
  const p = people[id];
  out.innerHTML = `<div class="card">
    <div class="head"><p class="name">${esc(p.name)}</p><p class="who">פלוגה ${esc(p.company)}${p.program?' · '+esc(p.program):''}</p>${numsHTML(p.team)}</div>
    <div class="body"><h3>הצוות שלך · ${byTeam[p.team].length} צוערים</h3>${matesHTML(byTeam[p.team], p.id)}<button type="button" class="back" id="back">חיפוש נוסף</button></div>
  </div>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
function showTeam(t){
  out.innerHTML = `<div class="card">
    <div class="head"><p class="name">צוות ${t}</p><p class="who">${byTeam[t].length} צוערים</p>${numsHTML(t)}</div>
    <div class="body"><h3>חברי הצוות</h3>${matesHTML(byTeam[t], -1)}<button type="button" class="back" id="back">חזרה לחיפוש</button></div>
  </div>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
q.addEventListener('input', renderList);
out.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='back'){ q.value=''; out.innerHTML=''; q.focus(); return; }
  if(b.dataset.id!==undefined) showPerson(+b.dataset.id);
});
const byRoom = [];
Object.keys(byTeam).map(Number).sort((a,b)=>a-b).forEach(t=>{
  const r = room(t); let e = byRoom.find(x=>x.room===r); if(!e){e={room:r,teams:[]};byRoom.push(e);} e.teams.push(t);
});
const roomsEl = document.getElementById('rooms');
roomsEl.innerHTML = byRoom.map(e=>`<div class="roomcard"><div class="rn">חדר <b>${esc(e.room)}</b></div><div class="ts">${
  e.teams.map(t=>`<button type="button" data-team="${t}">צוות ${t}</button>`).join('')}</div></div>`).join('');
roomsEl.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ showTeam(+b.dataset.team); } });

(function(){
  const c = document.getElementById('fx'); if(!c) return;
  const ctx = c.getContext('2d'); let W,H,band=0,parts=[],traces=[],pulses=[],dpr=1,sideX=()=>0;
  const glyphs = ['</>','{ }','//','<>','01','=>','()','&&'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); W=c.width=c.offsetWidth*dpr; H=c.height=c.offsetHeight*dpr; }
  function make(){
    parts=[]; const n=Math.round(W/dpr/70);
    band=Math.min(W*.5,360*dpr); // אזור הטקסט במרכז – בלי גליפים שם
    sideX=()=>{ const side=Math.random()<.5?-1:1; const free=Math.max(0,(W-band)/2); return W/2+side*(band/2+Math.random()*free); };
    for(let i=0;i<n;i++) parts.push({x:sideX(),y:Math.random()*H,s:(10+Math.random()*14)*dpr,v:(.08+Math.random()*.2)*dpr,
      a:.07+Math.random()*.12,g:glyphs[i%glyphs.length],leaf:Math.random()<.35,r:Math.random()*6.28,sx:null});
    // מסילות: קווים אורתוגונליים עם פניות של 90°/45°
    traces=[]; const g=28*dpr; const nt=Math.round(W/dpr/55);
    for(let i=0;i<nt;i++){
      let x=Math.round(Math.random()*W/g)*g, y=Math.round(Math.random()*H/g)*g; const pts=[[x,y]];
      let dir=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
      const segs=3+Math.floor(Math.random()*4);
      for(let s=0;s<segs;s++){ const len=g*(2+Math.floor(Math.random()*5)); x+=dir[0]*len; y+=dir[1]*len; pts.push([x,y]);
        dir = Math.random()<.5 ? [dir[1],dir[0]] : [-dir[1],-dir[0]]; }
      traces.push({pts,a:.10+Math.random()*.12});
    }
    pulses=traces.map(t=>({t,p:Math.random(),v:.0015+Math.random()*.003}));
  }
  function along(pts,p){ let L=0; const segs=[]; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);L+=d;}
    let d=p*L; for(let i=0;i<segs.length;i++){ if(d<=segs[i]){const k=d/segs[i];return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k];} d-=segs[i]; } return pts[pts.length-1]; }
  function leaf(p){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.beginPath(); ctx.ellipse(0,0,p.s*.55,p.s*.26,0,0,6.28); ctx.fill(); ctx.restore(); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=1.2*dpr; ctx.lineCap='round'; ctx.lineJoin='round';
    for(const t of traces){ ctx.globalAlpha=t.a; ctx.strokeStyle='#bfe3a6'; ctx.beginPath(); t.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
      ctx.fillStyle='#bfe3a6'; for(const p of [t.pts[0],t.pts[t.pts.length-1]]){ ctx.beginPath(); ctx.arc(p[0],p[1],2.6*dpr,0,6.28); ctx.fill(); } }
    for(const u of pulses){ const [x,y]=along(u.t.pts,u.p); ctx.globalAlpha=.9; ctx.fillStyle='#f2c23a'; ctx.shadowColor='#f2c23a'; ctx.shadowBlur=10*dpr;
      ctx.beginPath(); ctx.arc(x,y,2.2*dpr,0,6.28); ctx.fill(); ctx.shadowBlur=0; if(!reduce){ u.p+=u.v; if(u.p>1) u.p=0; } }
    if(W-band>80*dpr) for(const p of parts){ ctx.globalAlpha=p.a; ctx.fillStyle=p.leaf?'#f2c23a':'#ffffff';
      if(p.leaf) leaf(p); else { ctx.font=`700 ${p.s}px monospace`; ctx.fillText(p.g,p.x,p.y); }
      if(!reduce){ p.y-=p.v; p.r+=.004; if(p.y<-30){p.y=H+30;p.x=sideX();} } }
    ctx.globalAlpha=1;
    if(!reduce) requestAnimationFrame(draw);
  }
  size(); make(); draw();
  addEventListener('resize',()=>{size();make();});
})();
</script>

</body>
</html>
